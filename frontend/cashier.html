<!DOCTYPE html>
<html>
<head>
<title>AFRC Cashier</title>
<style>
body { font-family: system-ui; max-width: 700px; margin: 2rem auto; }
input, button { padding: 10px; margin: 5px; font-size: 1rem; }
.item { margin: 0.5rem 0; }
</style>
</head>
<body>
<h1>🔐 Cashier Verification</h1>
<p>Enter 4-digit PIN and session ID to correct bill.</p>
<input id="pin" type="password" maxlength="4" placeholder="PIN (default 1234)">
<input id="session" placeholder="Session ID from customer screen">
<button onclick="loadSession()">Load</button>
<div id="corrections"></div>
<button onclick="verify()">Confirm & Recalculate</button>
<div id="final"></div>
<script>
async function loadSession() {
  // In full version, fetch session. For proto, show editable common items
  document.getElementById("corrections").innerHTML = `
    <h3>Correct quantities (from today's menu)</h3>
    <div class="item">Rice: <input type="number" id="q-rice" value="1" step="0.5"></div>
    <div class="item">Chicken: <input type="number" id="q-chicken" value="1"></div>
    <div class="item">Vegetables: <input type="number" id="q-veg" value="1"></div>
    <div class="item">Ikan bawal (per piece): <input type="number" id="q-ikan" value="0"></div>
  `;
}
async function verify() {
  const pin = document.getElementById("pin").value;
  const session = document.getElementById("session").value;
  const corrections = [
    {name: "Rice", quantity: parseFloat(document.getElementById("q-rice").value)},
    {name: "Chicken", quantity: parseFloat(document.getElementById("q-chicken").value)},
    {name: "Vegetables", quantity: parseFloat(document.getElementById("q-veg").value)},
    {name: "Ikan bawal (per piece)", quantity: parseFloat(document.getElementById("q-ikan").value)}
  ].filter(c => c.quantity > 0);
  
  const res = await fetch("/api/verify", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ session_id: session, pin, corrections })
  });
  const data = await res.json();
  if (data.detail) { alert(data.detail); return; }
  document.getElementById("final").innerHTML = `<h2>Verified Total: RM ${data.total.toFixed(2)}</h2>`;
}
</script>
</body>
</html>
