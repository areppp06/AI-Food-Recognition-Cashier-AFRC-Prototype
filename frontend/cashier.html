<!DOCTYPE html>
<html>
<head>
<title>AFRC Cashier</title>
<style>
body { font-family: system-ui; max-width: 700px; margin: 2rem auto; }
input, button { padding: 10px; margin: 5px; font-size: 1rem; }
.item { margin: 0.5rem 0; }
</style>
</head>
<body>
<h1>🔐 Cashier Verification</h1>
<p>Enter 4-digit PIN and session ID to correct bill.</p>
<input id="pin" type="password" maxlength="4" placeholder="PIN (default 1234)">
<input id="session" placeholder="Session ID from customer screen">
<button onclick="loadSession()">Load</button>
<div id="corrections"></div>
<div id="verify-turnstile" style="display:none; margin: 1rem 0;"></div>
<button id="verifyBtn" onclick="verify()">Confirm & Recalculate</button>
<div id="final"></div>
<script>
let verifyWidgetId;
let verifyToken = "";
let verifyFailed = false;
let verifyInteractive = false;
let verifyWaiters = [];
const verifySlot = document.getElementById("verify-turnstile");

function settleVerifyWaiters(token, error) {
  const list = verifyWaiters.splice(0, verifyWaiters.length);
  list.forEach(w => {
    clearTimeout(w.timer);
    if (token) w.resolve(token);
    else w.reject(error || new Error("CAPTCHA_FAILED"));
  });
}

window.onVerifyTurnstileLoad = () => {
  verifyWidgetId = window.turnstile.render("#verify-turnstile", {
    sitekey: "0x4AAAAAAF7mA3wP9mtOWZAJ",
    action: "verify",
    appearance: "interaction-only",
    "before-interactive-callback": () => {
      verifyInteractive = true;
      verifySlot.style.display = "block";
    },
    "after-interactive-callback": () => {
      verifyInteractive = false;
      verifySlot.style.display = "none";
    },
    callback: (token) => {
      verifyToken = token || "";
      verifyFailed = false;
      verifyInteractive = false;
      verifySlot.style.display = "none";
      if (verifyToken) settleVerifyWaiters(verifyToken, null);
    },
    "expired-callback": () => {
      verifyToken = "";
      if (verifyWidgetId !== undefined && window.turnstile) {
        window.turnstile.reset(verifyWidgetId);
      }
    },
    "error-callback": () => {
      verifyToken = "";
      verifyFailed = true;
      verifySlot.style.display = "none";
      settleVerifyWaiters(null, new Error("CAPTCHA_FAILED"));
    },
    "timeout-callback": () => {
      verifyToken = "";
      verifyFailed = true;
      verifySlot.style.display = "none";
      settleVerifyWaiters(null, new Error("CAPTCHA_FAILED"));
    }
  });
};
function resetVerifyTurnstile() {
  verifyToken = "";
  verifyFailed = false;
  verifyInteractive = false;
  verifySlot.style.display = "none";
  if (verifyWidgetId !== undefined && window.turnstile) {
    window.turnstile.reset(verifyWidgetId);
  }
}
function getVerifyToken() {
  const existing = verifyToken || (verifyWidgetId !== undefined && window.turnstile && window.turnstile.getResponse(verifyWidgetId)) || "";
  if (existing) return Promise.resolve(existing);
  if (verifyFailed && verifyWidgetId !== undefined && window.turnstile) {
    verifyFailed = false;
    window.turnstile.reset(verifyWidgetId);
  }
  return new Promise((resolve, reject) => {
    const waiter = {
      resolve,
      reject,
      timer: setTimeout(() => {
        if (verifyInteractive) return;
        const idx = verifyWaiters.indexOf(waiter);
        if (idx !== -1) verifyWaiters.splice(idx, 1);
        reject(new Error("CAPTCHA_FAILED"));
      }, 15000)
    };
    verifyWaiters.push(waiter);
  });
}
async function loadSession() {
  // In full version, fetch session. For proto, show editable common items
  document.getElementById("corrections").innerHTML = `
    <h3>Correct quantities (from today's menu)</h3>
    <div class="item">Rice: <input type="number" id="q-rice" value="1" step="0.5"></div>
    <div class="item">Chicken: <input type="number" id="q-chicken" value="1"></div>
    <div class="item">Vegetables: <input type="number" id="q-veg" value="1"></div>
    <div class="item">Ikan bawal (per piece): <input type="number" id="q-ikan" value="0"></div>
  `;
}
async function verify() {
  const pin = document.getElementById("pin").value;
  const session = document.getElementById("session").value;
  const corrections = [
    {name: "Rice", quantity: parseFloat(document.getElementById("q-rice").value)},
    {name: "Chicken", quantity: parseFloat(document.getElementById("q-chicken").value)},
    {name: "Vegetables", quantity: parseFloat(document.getElementById("q-veg").value)},
    {name: "Ikan bawal (per piece)", quantity: parseFloat(document.getElementById("q-ikan").value)}
  ].filter(c => c.quantity > 0);
  
  const btn = document.getElementById("verifyBtn");
  btn.disabled = true;
  let token = "";
  try {
    token = await getVerifyToken();
  } catch (err) {
    btn.disabled = false;
    alert("Captcha verification failed. Please try again.");
    resetVerifyTurnstile();
    return;
  }

  try {
    const res = await fetch("/api/verify", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        session_id: session,
        pin,
        corrections,
        "cf-turnstile-response": token
      })
    });
    const data = await res.json();
    if (!res.ok || data.detail) {
      if (res.status === 403 || data.detail === "forbidden") {
        alert("Captcha verification failed. Please try again.");
      } else {
        alert(data.detail || "Verification failed.");
      }
      return;
    }
    document.getElementById("final").innerHTML = `<h2>Verified Total: RM ${data.total.toFixed(2)}</h2>`;
  } finally {
    btn.disabled = false;
    resetVerifyTurnstile();
  }
}
</script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onVerifyTurnstileLoad&render=explicit" async defer></script>
</body>
</html>
