<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Payment Receipt — Self-Service</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-white border border-slate-200 rounded-3xl p-6 sm:p-8 shadow-xl shadow-slate-200/70">
    <div id="receiptBody" class="text-center">
      <div class="w-16 h-16 rounded-full bg-orange-50 text-orange-600 flex items-center justify-center mx-auto mb-4">
        <span class="material-symbols-outlined text-[34px] animate-spin">progress_activity</span>
      </div>
      <h1 class="text-xl font-extrabold text-slate-900 mb-1">Verifying Payment...</h1>
      <p class="text-sm text-slate-500">Please wait a moment while we confirm your receipt.</p>
    </div>
  </div>

  <!-- Popup Modal: Akaun tidak wujud -->
  <div id="noAccountModal" class="hidden fixed inset-0 z-50 bg-slate-900/55 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="w-full max-w-sm bg-white border border-slate-200 rounded-3xl p-6 text-center shadow-2xl">
      <div class="w-14 h-14 rounded-full bg-amber-50 text-amber-600 flex items-center justify-center mx-auto mb-3 ring-8 ring-amber-100/70">
        <span class="material-symbols-outlined text-[30px]">account_circle</span>
      </div>
      <h2 class="text-xl font-extrabold text-slate-900 mb-2">Akaun tidak wujud</h2>
      <p id="noAccountModalDesc" class="text-sm text-slate-600 leading-relaxed mb-5"></p>
      <button type="button" onclick="closeNoAccountModal()" class="w-full py-3 rounded-2xl bg-orange-600 hover:bg-orange-500 text-white font-bold transition-colors">
        Faham
      </button>
    </div>
  </div>

  <script>
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const fmtRM = (n) => "RM " + Number(n || 0).toFixed(2);

    let _currentBillId = "";
    let _redirectTimer = null;
    let _redirectPaused = false;
    let _remainingSeconds = 23;

    function pauseRedirectCountdown() {
      _redirectPaused = true;
      const el = document.getElementById("redirectCountdownText");
      if (el) el.textContent = "Auto-return paused while claiming points...";
    }

    function resumeRedirectCountdown() {
      _redirectPaused = false;
      const el = document.getElementById("redirectCountdownText");
      if (el) {
        el.innerHTML = `Returning to Self-Service in <strong class="text-slate-800">${_remainingSeconds}s</strong>...`;
      }
    }

    function startRedirectCountdown(seconds) {
      if (_redirectTimer) clearInterval(_redirectTimer);
      _remainingSeconds = Math.max(1, Number(seconds) || 23);
      _redirectPaused = false;
      const el = document.getElementById("redirectCountdownText");
      _redirectTimer = setInterval(() => {
        if (_redirectPaused) return;
        _remainingSeconds -= 1;
        if (_remainingSeconds <= 0) {
          clearInterval(_redirectTimer);
          window.location.replace("/selfservice");
          return;
        }
        if (el) {
          el.innerHTML = `Returning to Self-Service in <strong class="text-slate-800">${_remainingSeconds}s</strong>...`;
        }
      }, 1000);
    }

    function openNoAccountModal(email) {
      pauseRedirectCountdown();
      const modal = document.getElementById("noAccountModal");
      const desc = document.getElementById("noAccountModalDesc");
      if (desc) {
        desc.innerHTML = `Poin telah dimasukkan ke <strong class="text-slate-900">${esc(email)}</strong> sila daftar masuk di <strong class="text-slate-900">takcakap.com</strong> menggunakan email yang sama melalui telefon anda untuk aktifkan akun anda.`;
      }
      if (modal) modal.classList.remove("hidden");
    }

    function closeNoAccountModal() {
      const modal = document.getElementById("noAccountModal");
      if (modal) modal.classList.add("hidden");
      resumeRedirectCountdown();
    }

    async function submitClaimPoints() {
      const inp = document.getElementById("claimGmailInput");
      const errEl = document.getElementById("claimErrorMsg");
      const btn = document.getElementById("claimSubmitBtn");
      const box = document.getElementById("claimPointsBox");
      const email = (inp ? inp.value : "").trim().toLowerCase();

      if (!/^[a-zA-Z0-9_.+-]+@gmail\.com$/.test(email)) {
        if (errEl) {
          errEl.textContent = "Sila masukkan alamat email @gmail.com yang sah.";
          errEl.classList.remove("hidden");
        }
        return;
      }
      if (errEl) errEl.classList.add("hidden");
      if (btn) {
        btn.disabled = true;
        btn.textContent = "Claiming...";
      }

      try {
        const res = await fetch("/api/selfservice/bills/" + encodeURIComponent(_currentBillId) + "/claim-points", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          if (errEl) {
            errEl.textContent = (typeof data.detail === "string" ? data.detail : data.detail?.message) || "Unable to claim points.";
            errEl.classList.remove("hidden");
          }
          if (btn) {
            btn.disabled = false;
            btn.textContent = "Claim Points";
          }
          return;
        }

        if (data.account_exists) {
          if (box) {
            box.innerHTML = `
              <div class="flex items-center gap-2.5 text-left bg-emerald-50 border border-emerald-200 rounded-2xl p-3.5 text-emerald-800">
                <span class="material-symbols-outlined text-emerald-600 text-[22px] shrink-0">verified</span>
                <div class="text-xs leading-snug">
                  <div class="font-extrabold">Points Claimed (+${Number(data.points || 0)} pts)!</div>
                  <div>Credited to <strong>${esc(data.email)}</strong></div>
                </div>
              </div>
            `;
          }
          resumeRedirectCountdown();
        } else {
          if (box) {
            box.innerHTML = `
              <div class="flex items-center gap-2.5 text-left bg-amber-50 border border-amber-200 rounded-2xl p-3.5 text-amber-900">
                <span class="material-symbols-outlined text-amber-600 text-[22px] shrink-0">schedule</span>
                <div class="text-xs leading-snug">
                  <div class="font-extrabold">+${Number(data.points || 0)} pts disimpan untuk ${esc(data.email)}</div>
                  <div>Daftar masuk di <strong>takcakap.com</strong> untuk aktifkan akun anda.</div>
                </div>
              </div>
            `;
          }
          openNoAccountModal(data.email);
        }
      } catch (e) {
        if (errEl) {
          errEl.textContent = "Network error. Please try again.";
          errEl.classList.remove("hidden");
        }
        if (btn) {
          btn.disabled = false;
          btn.textContent = "Claim Points";
        }
      }
    }

    function renderClaimSection(bill) {
      if (bill.status !== "paid" || Number(bill.points_earned || 0) <= 0) return "";
      const pts = Number(bill.points_earned || 0);
      if (bill.points_status === "claimed") {
        return `
          <div id="claimPointsBox" class="mb-5">
            <div class="flex items-center gap-2.5 text-left bg-emerald-50 border border-emerald-200 rounded-2xl p-3.5 text-emerald-800">
              <span class="material-symbols-outlined text-emerald-600 text-[22px] shrink-0">verified</span>
              <div class="text-xs leading-snug">
                <div class="font-extrabold">Points Claimed (+${pts} pts)</div>
                <div>Credited to <strong>${esc(bill.points_claimed_email)}</strong></div>
              </div>
            </div>
          </div>`;
      }
      if (bill.points_status === "pending_email") {
        return `
          <div id="claimPointsBox" class="mb-5">
            <div class="flex items-center gap-2.5 text-left bg-amber-50 border border-amber-200 rounded-2xl p-3.5 text-amber-900">
              <span class="material-symbols-outlined text-amber-600 text-[22px] shrink-0">schedule</span>
              <div class="text-xs leading-snug">
                <div class="font-extrabold">+${pts} pts disimpan untuk ${esc(bill.points_claimed_email)}</div>
                <div>Daftar masuk di <strong>takcakap.com</strong> untuk aktifkan akun anda.</div>
              </div>
            </div>
          </div>`;
      }
      return `
        <div id="claimPointsBox" class="bg-orange-50/70 border border-orange-200 rounded-2xl p-4 mb-5 text-left">
          <div class="flex items-center gap-2 mb-1.5">
            <span class="material-symbols-outlined text-orange-600 text-[20px]">stars</span>
            <span class="text-sm font-extrabold text-slate-900">Claim +${pts} Loyalty Points</span>
          </div>
          <p class="text-xs text-slate-600 mb-3">Masukkan email <strong>@gmail.com</strong> anda untuk tuntut poin tanpa perlu log masuk.</p>
          <div class="flex gap-2">
            <input id="claimGmailInput" type="email" placeholder="nama@gmail.com" onfocus="pauseRedirectCountdown()" oninput="pauseRedirectCountdown()" onkeydown="if(event.key==='Enter'){event.preventDefault();submitClaimPoints();}" class="flex-1 min-w-0 h-10 px-3 rounded-xl bg-white border border-slate-300 text-xs font-semibold text-slate-900 placeholder-slate-400 focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20 outline-none">
            <button id="claimSubmitBtn" type="button" onclick="submitClaimPoints()" class="h-10 px-4 rounded-xl bg-slate-900 hover:bg-orange-600 text-white text-xs font-bold transition-colors shrink-0">
              Claim Points
            </button>
          </div>
          <p id="claimErrorMsg" class="hidden text-xs font-semibold text-red-600 mt-2"></p>
        </div>
      `;
    }

    async function loadReceipt(attempt = 0) {
      const params = new URLSearchParams(window.location.search);
      const billId = (params.get("bill") || "").trim();
      _currentBillId = billId;
      const bodyEl = document.getElementById("receiptBody");
      if (!billId) {
        bodyEl.innerHTML = `
          <div class="w-16 h-16 rounded-full bg-red-50 text-red-600 flex items-center justify-center mx-auto mb-4">
            <span class="material-symbols-outlined text-[34px]">error</span>
          </div>
          <h1 class="text-xl font-extrabold text-slate-900 mb-2">Receipt Not Found</h1>
          <p class="text-sm text-slate-500 mb-6">Missing order reference.</p>
          <a href="/selfservice" class="inline-flex items-center justify-center gap-2 w-full py-3.5 rounded-2xl bg-orange-600 hover:bg-orange-500 text-white font-bold transition-colors">
            <span class="material-symbols-outlined text-[20px]">restaurant_menu</span>
            Back to Menu
          </a>`;
        return;
      }

      try {
        const res = await fetch("/api/selfservice/bills/" + encodeURIComponent(billId), { cache: "no-store" });
        if (!res.ok) throw new Error("Bill not found");
        const bill = await res.json();

        if (bill.status === "pending" && attempt < 6) {
          setTimeout(() => loadReceipt(attempt + 1), 1500);
          return;
        }

        const isPaid = bill.status === "paid";
        const itemsHtml = (bill.items || []).map((it) => {
          const ppp = Number(it.pieces_per_portion || 1);
          const pcTag = ppp > 1 ? `<span class="text-[11px] text-orange-600 font-semibold ml-1">(${ppp} pcs/portion)</span>` : "";
          return `
            <div class="flex items-start justify-between gap-3 py-2.5 border-b border-slate-200/80 last:border-b-0 text-left">
              <div>
                <div class="text-sm font-bold text-slate-900">${esc(it.name)} &times; ${Number(it.quantity || 1)}${pcTag}</div>
                <div class="text-xs text-slate-500">${fmtRM(it.unit_price)} each</div>
              </div>
              <div class="text-sm font-extrabold text-orange-600 shrink-0">${fmtRM(it.subtotal)}</div>
            </div>`;
        }).join("");

        const discountLine = Number(bill.discount_amount || 0) > 0
          ? `<div class="flex items-center justify-between text-xs font-bold text-emerald-600 py-2 border-t border-slate-200/80">
               <span>Voucher (${esc(bill.voucher_code)})</span>
               <span>-${fmtRM(bill.discount_amount)}</span>
             </div>`
          : "";

        bodyEl.innerHTML = `
          <div class="w-16 h-16 rounded-full ${isPaid ? "bg-emerald-50 text-emerald-600 ring-8 ring-emerald-100/70" : "bg-amber-50 text-amber-600 ring-8 ring-amber-100/70"} flex items-center justify-center mx-auto mb-4">
            <span class="material-symbols-outlined text-[34px]">${isPaid ? "check_circle" : "schedule"}</span>
          </div>
          <div class="text-xs font-bold uppercase tracking-wider ${isPaid ? "text-emerald-600" : "text-amber-600"} mb-1">
            ${isPaid ? "Payment Successful" : "Payment Pending"}
          </div>
          <h1 class="text-2xl font-extrabold text-slate-900 mb-1">${esc(bill.bill_number || "Order")}</h1>
          <p class="text-xs text-slate-500 mb-5">${esc(bill.restaurant_name || "Self-Service Kiosk")}</p>

          <div class="bg-slate-50 border border-slate-200 rounded-2xl px-4 py-2 mb-4">
            ${itemsHtml || '<div class="py-3 text-xs text-slate-400">No items listed</div>'}
            ${discountLine}
          </div>

          <div class="flex items-center justify-between bg-slate-100 border border-slate-200 rounded-2xl px-4 py-3 mb-4">
            <span class="text-sm font-bold text-slate-700">Total Paid</span>
            <span class="text-xl font-extrabold text-orange-600">${fmtRM(bill.total)}</span>
          </div>

          ${bill.receipt_email ? `<p class="text-xs text-slate-500 mb-4">Receipt email: <strong class="text-slate-800">${esc(bill.receipt_email)}</strong></p>` : ""}

          ${renderClaimSection(bill)}

          <a href="/selfservice" class="inline-flex items-center justify-center gap-2 w-full py-3.5 rounded-2xl bg-orange-600 hover:bg-orange-500 text-white font-bold shadow-lg shadow-orange-600/20 transition-colors">
            <span class="material-symbols-outlined text-[20px]">add_shopping_cart</span>
            New Order
          </a>
          <p id="redirectCountdownText" class="text-xs text-slate-500 mt-3">Returning to Self-Service in <strong class="text-slate-800">23s</strong>...</p>
        `;
        startRedirectCountdown(23);
      } catch (e) {
        bodyEl.innerHTML = `
          <div class="w-16 h-16 rounded-full bg-red-50 text-red-600 flex items-center justify-center mx-auto mb-4">
            <span class="material-symbols-outlined text-[34px]">error</span>
          </div>
          <h1 class="text-xl font-extrabold text-slate-900 mb-2">Unable to Load Receipt</h1>
          <p class="text-sm text-slate-500 mb-6">Please check with our staff at the counter if payment was deducted.</p>
          <a href="/selfservice" class="inline-flex items-center justify-center gap-2 w-full py-3.5 rounded-2xl bg-orange-600 hover:bg-orange-500 text-white font-bold transition-colors">
            Back to Self-Service
          </a>`;
      }
    }

    loadReceipt(0);
  </script>
</body>
</html>
