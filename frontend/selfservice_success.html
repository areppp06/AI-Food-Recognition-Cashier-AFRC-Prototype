<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Payment Receipt — Self-Service</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl">
    <div id="receiptBody" class="text-center">
      <div class="w-16 h-16 rounded-full bg-orange-500/15 text-orange-400 flex items-center justify-center mx-auto mb-4">
        <span class="material-symbols-outlined text-[34px] animate-spin">progress_activity</span>
      </div>
      <h1 class="text-xl font-extrabold text-slate-100 mb-1">Verifying Payment...</h1>
      <p class="text-sm text-slate-400">Please wait a moment while we confirm your receipt.</p>
    </div>
  </div>

  <script>
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const fmtRM = (n) => "RM " + Number(n || 0).toFixed(2);

    async function loadReceipt(attempt = 0) {
      const params = new URLSearchParams(window.location.search);
      const billId = (params.get("bill") || "").trim();
      const bodyEl = document.getElementById("receiptBody");
      if (!billId) {
        bodyEl.innerHTML = `
          <div class="w-16 h-16 rounded-full bg-red-500/15 text-red-400 flex items-center justify-center mx-auto mb-4">
            <span class="material-symbols-outlined text-[34px]">error</span>
          </div>
          <h1 class="text-xl font-extrabold text-slate-100 mb-2">Receipt Not Found</h1>
          <p class="text-sm text-slate-400 mb-6">Missing order reference.</p>
          <a href="/selfservice" class="inline-flex items-center justify-center gap-2 w-full py-3.5 rounded-2xl bg-orange-600 hover:bg-orange-500 text-white font-bold transition-colors">
            <span class="material-symbols-outlined text-[20px]">restaurant_menu</span>
            Back to Menu
          </a>`;
        return;
      }

      try {
        const res = await fetch("/api/selfservice/bills/" + encodeURIComponent(billId), { cache: "no-store" });
        if (!res.ok) throw new Error("Bill not found");
        const bill = await res.json();

        if (bill.status === "pending" && attempt < 6) {
          setTimeout(() => loadReceipt(attempt + 1), 1500);
          return;
        }

        const isPaid = bill.status === "paid";
        const itemsHtml = (bill.items || []).map((it) => {
          const ppp = Number(it.pieces_per_portion || 1);
          const pcTag = ppp > 1 ? `<span class="text-[11px] text-orange-300 font-semibold ml-1">(${ppp} pcs/portion)</span>` : "";
          return `
            <div class="flex items-start justify-between gap-3 py-2.5 border-b border-slate-800/80 last:border-b-0 text-left">
              <div>
                <div class="text-sm font-bold text-slate-100">${esc(it.name)} &times; ${Number(it.quantity || 1)}${pcTag}</div>
                <div class="text-xs text-slate-400">${fmtRM(it.unit_price)} each</div>
              </div>
              <div class="text-sm font-extrabold text-orange-400 shrink-0">${fmtRM(it.subtotal)}</div>
            </div>`;
        }).join("");

        bodyEl.innerHTML = `
          <div class="w-16 h-16 rounded-full ${isPaid ? "bg-emerald-500/15 text-emerald-400 ring-8 ring-emerald-500/10" : "bg-amber-500/15 text-amber-400 ring-8 ring-amber-500/10"} flex items-center justify-center mx-auto mb-4">
            <span class="material-symbols-outlined text-[34px]">${isPaid ? "check_circle" : "schedule"}</span>
          </div>
          <div class="text-xs font-bold uppercase tracking-wider ${isPaid ? "text-emerald-400" : "text-amber-400"} mb-1">
            ${isPaid ? "Payment Successful" : "Payment Pending"}
          </div>
          <h1 class="text-2xl font-extrabold text-slate-100 mb-1">${esc(bill.bill_number || "Order")}</h1>
          <p class="text-xs text-slate-400 mb-5">${esc(bill.restaurant_name || "Self-Service Kiosk")}</p>

          <div class="bg-slate-950/70 border border-slate-800 rounded-2xl px-4 py-2 mb-4">
            ${itemsHtml || '<div class="py-3 text-xs text-slate-400">No items listed</div>'}
          </div>

          <div class="flex items-center justify-between bg-slate-800/70 border border-slate-700/80 rounded-2xl px-4 py-3 mb-5">
            <span class="text-sm font-bold text-slate-300">Total Paid</span>
            <span class="text-xl font-extrabold text-orange-400">${fmtRM(bill.total)}</span>
          </div>

          ${bill.receipt_email ? `<p class="text-xs text-slate-400 mb-4">Receipt email: <strong class="text-slate-200">${esc(bill.receipt_email)}</strong></p>` : ""}

          <a href="/selfservice" class="inline-flex items-center justify-center gap-2 w-full py-3.5 rounded-2xl bg-orange-600 hover:bg-orange-500 text-white font-bold shadow-lg shadow-orange-600/25 transition-colors">
            <span class="material-symbols-outlined text-[20px]">add_shopping_cart</span>
            New Order
          </a>
        `;
      } catch (e) {
        bodyEl.innerHTML = `
          <div class="w-16 h-16 rounded-full bg-red-500/15 text-red-400 flex items-center justify-center mx-auto mb-4">
            <span class="material-symbols-outlined text-[34px]">error</span>
          </div>
          <h1 class="text-xl font-extrabold text-slate-100 mb-2">Unable to Load Receipt</h1>
          <p class="text-sm text-slate-400 mb-6">Please check with our staff at the counter if payment was deducted.</p>
          <a href="/selfservice" class="inline-flex items-center justify-center gap-2 w-full py-3.5 rounded-2xl bg-orange-600 hover:bg-orange-500 text-white font-bold transition-colors">
            Back to Self-Service
          </a>`;
      }
    }

    loadReceipt(0);
  </script>
</body>
</html>
