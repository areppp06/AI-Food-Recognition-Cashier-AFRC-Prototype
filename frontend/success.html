<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AFRC - Mobile Payment Success</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    background: #f8fafc;
    color: #0f172a;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 1.5rem 1rem;
  }
  .card {
    background: #ffffff;
    border-radius: 28px;
    padding: 2.25rem 1.5rem 1.75rem;
    box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.06), 0 1px 3px rgba(0, 0, 0, 0.02);
    border: 1px solid #f1f5f9;
    text-align: center;
    width: 100%;
    max-width: 360px;
    animation: popIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes popIn {
    0% { opacity: 0; transform: translateY(16px) scale(0.96); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  .icon-wrapper {
    position: relative;
    width: 72px;
    height: 72px;
    margin: 0 auto 1.25rem;
    background: #ecfdf5;
    color: #10b981;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 0 10px #f0fdf4;
  }
  .icon-wrapper svg {
    width: 34px;
    height: 34px;
    stroke: currentColor;
    stroke-width: 2.75;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
    stroke-dasharray: 50;
    stroke-dashoffset: 0;
    animation: draw 0.6s ease-out;
  }
  @keyframes draw {
    0% { stroke-dashoffset: 50; }
    100% { stroke-dashoffset: 0; }
  }
  h1 {
    font-size: 1.45rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: #0f172a;
    margin-bottom: 0.35rem;
  }
  .subtitle {
    color: #64748b;
    font-size: 0.88rem;
    margin-bottom: 1.5rem;
  }
  .amount-card {
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 18px;
    padding: 1.15rem 1rem;
    margin-bottom: 1.25rem;
  }
  .amount-label {
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #94a3b8;
    margin-bottom: 0.25rem;
  }
  .amount-val {
    font-size: 1.85rem;
    font-weight: 800;
    color: #ff5e36;
    letter-spacing: -0.03em;
  }
  .status-text {
    font-size: 0.82rem;
    color: #64748b;
    line-height: 1.45;
    margin-bottom: 1.75rem;
  }
  .status-text span {
    font-weight: 600;
    color: #0f172a;
  }
  .btn-action {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    width: 100%;
    background: #0f172a;
    color: #ffffff;
    text-decoration: none;
    padding: 0.95rem 1.25rem;
    border-radius: 9999px;
    font-size: 0.95rem;
    font-weight: 600;
    box-shadow: 0 4px 14px rgba(15, 23, 42, 0.2);
    transition: all 0.2s ease;
    cursor: pointer;
    border: none;
  }
  .btn-action:active {
    transform: scale(0.98);
    background: #1e293b;
  }
</style>
</head>
<body>
  <div class="card">
    <style>
  @keyframes pulseBadge {
    0%, 100% {
      transform: scale(1);
      box-shadow: 0 0 0 10px #f0fdf4, 0 0 20px 4px rgba(16, 185, 129, 0.15);
    }
    50% {
      transform: scale(1.08);
      box-shadow: 0 0 0 16px rgba(240, 253, 244, 0.8), 0 0 32px 8px rgba(16, 185, 129, 0.28);
    }
  }
  @keyframes iconCheckPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.12); }
  }
  @keyframes rippleRing {
    0% {
      transform: scale(0.9);
      opacity: 0.8;
    }
    100% {
      transform: scale(1.8);
      opacity: 0;
    }
  }
  .icon-wrapper {
    animation: pulseBadge 2.4s ease-in-out infinite !important;
    position: relative;
  }
  .icon-wrapper svg {
    animation: iconCheckPulse 2.4s ease-in-out infinite !important;
  }
  .ripple-ring {
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    border: 2px solid rgba(16, 185, 129, 0.45);
    animation: rippleRing 2.4s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
    pointer-events: none;
  }
  .ripple-ring-2 {
    animation-delay: 1.2s;
  }
</style><div class="icon-wrapper"><div class="ripple-ring"></div><div class="ripple-ring ripple-ring-2"></div>
      <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
    </div>
    <h1>Payment Successful</h1>
    <p class="subtitle">Thank you for dining with AFRC.</p>
    
    <div class="amount-card">
      <div class="amount-label">Total Amount Paid</div>
      <div id="total" class="amount-val">RM 11.00</div>
    </div>
    
    <p id="emailNote" class="status-text">Receipt saved. <span>Next order ready.</span></p>
    
    <button class="btn-action" onclick="location.href='/'">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
      Start another plate
    </button>
  </div>

  <script>
    const sessionId = new URLSearchParams(location.search).get("session") || "";
    async function load() {
      if (!sessionId) return;
      try {
        const res = await fetch("/api/sessions/" + encodeURIComponent(sessionId));
        if (!res.ok) return;
        const data = await res.json();
        if (data.total) document.getElementById("total").textContent = "RM " + Number(data.total).toFixed(2);
        if (data.receipt_email) {
          document.getElementById("emailNote").innerHTML = "Receipt sent to: <span>" + data.receipt_email + "</span>";
        }
      } catch (e) {}
    }
    load();
  </script>



</body></html>
