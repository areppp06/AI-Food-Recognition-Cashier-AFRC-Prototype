<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AFRC - Mobile Payment Success</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    background: #f8fafc;
    color: #0f172a;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 1.5rem 1rem;
  }
  .card {
    background: #ffffff;
    border-radius: 28px;
    padding: 2.25rem 1.5rem 1.75rem;
    box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.06), 0 1px 3px rgba(0, 0, 0, 0.02);
    border: 1px solid #f1f5f9;
    text-align: center;
    width: 100%;
    max-width: 375px;
    animation: popIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes popIn {
    0% { opacity: 0; transform: translateY(16px) scale(0.96); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  .icon-wrapper {
    position: relative;
    width: 72px;
    height: 72px;
    margin: 0 auto 1.25rem;
    background: #ecfdf5;
    color: #10b981;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 0 10px #f0fdf4;
  }
  .icon-wrapper svg {
    width: 34px;
    height: 34px;
    stroke: currentColor;
    stroke-width: 2.75;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
    stroke-dasharray: 50;
    stroke-dashoffset: 0;
    animation: draw 0.6s ease-out;
  }
  @keyframes draw {
    0% { stroke-dashoffset: 50; }
    100% { stroke-dashoffset: 0; }
  }
  h1 {
    font-size: 1.45rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: #0f172a;
    margin-bottom: 0.45rem;
  }
  .bill-pill {
    display: inline-flex;
    align-items: center;
    white-space: nowrap;
    gap: 0.35rem;
    background: #f1f5f9;
    border: 1px solid #e2e8f0;
    color: #0f172a;
    font-size: 0.82rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding: 0.3rem 0.85rem;
    border-radius: 9999px;
    margin-bottom: 0.65rem;
  }
  .subtitle {
    color: #64748b;
    font-size: 0.88rem;
    margin-bottom: 1.35rem;
  }
  .amount-card {
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 18px;
    padding: 1.15rem 1rem;
    margin-bottom: 1.15rem;
  }
  .amount-label {
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #94a3b8;
    margin-bottom: 0.25rem;
  }
  .amount-val {
    font-size: 1.85rem;
    font-weight: 800;
    color: #ff5e36;
    letter-spacing: -0.03em;
  }
  .status-text {
    font-size: 0.82rem;
    color: #64748b;
    line-height: 1.45;
    margin-bottom: 1.25rem;
  }
  .status-text span {
    font-weight: 600;
    color: #0f172a;
  }
  .receipt-actions {
    display: flex;
    gap: 0.6rem;
    margin-bottom: 0.7rem;
  }
  .btn-secondary {
    flex: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.45rem;
    background: #ffffff;
    color: #0f172a;
    border: 1.5px solid #cbd5e1;
    padding: 0.8rem 0.9rem;
    border-radius: 9999px;
    font-size: 0.86rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .btn-secondary:hover {
    background: #f8fafc;
    border-color: #94a3b8;
  }
  .btn-secondary:active {
    transform: scale(0.98);
  }
  .btn-action {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    width: 100%;
    background: #0f172a;
    color: #ffffff;
    text-decoration: none;
    padding: 0.95rem 1.25rem;
    border-radius: 9999px;
    font-size: 0.95rem;
    font-weight: 600;
    box-shadow: 0 4px 14px rgba(15, 23, 42, 0.2);
    transition: all 0.2s ease;
    cursor: pointer;
    border: none;
  }
  .btn-action:active {
    transform: scale(0.98);
    background: #1e293b;
  }
</style>
</head>
<body>
  <div class="card">
    <style>
  @keyframes pulseBadge {
    0%, 100% {
      transform: scale(1);
      box-shadow: 0 0 0 10px #f0fdf4, 0 0 20px 4px rgba(16, 185, 129, 0.15);
    }
    50% {
      transform: scale(1.08);
      box-shadow: 0 0 0 16px rgba(240, 253, 244, 0.8), 0 0 32px 8px rgba(16, 185, 129, 0.28);
    }
  }
  @keyframes iconCheckPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.12); }
  }
  @keyframes rippleRing {
    0% {
      transform: scale(0.9);
      opacity: 0.8;
    }
    100% {
      transform: scale(1.8);
      opacity: 0;
    }
  }
  .icon-wrapper {
    animation: pulseBadge 2.4s ease-in-out infinite !important;
    position: relative;
  }
  .icon-wrapper svg {
    animation: iconCheckPulse 2.4s ease-in-out infinite !important;
  }
  .ripple-ring {
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    border: 2px solid rgba(16, 185, 129, 0.45);
    animation: rippleRing 2.4s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
    pointer-events: none;
  }
  .ripple-ring-2 {
    animation-delay: 1.2s;
  }
</style><div class="icon-wrapper"><div class="ripple-ring"></div><div class="ripple-ring ripple-ring-2"></div>
      <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
    </div>
    <h1>Payment Successful</h1>
    <div id="billNo" class="bill-pill">Bill #AAA-0001</div>
    <p class="subtitle">Selamat Menjamu Selera!</p>
    
    <div class="amount-card">
      <div class="amount-label">Total Amount Paid</div>
      <div id="total" class="amount-val">RM 0.00</div>
    </div>
    
    <p id="emailNote" class="status-text">Save or Share Receipt</p>
    
    <div class="receipt-actions">
      <button class="btn-secondary" id="saveReceiptBtn" type="button" onclick="saveReceiptPdf()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        Save Receipt
      </button>
      <button class="btn-secondary" id="shareReceiptBtn" type="button" onclick="shareReceiptPdf()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="18" cy="5" r="3"></circle>
          <circle cx="6" cy="12" r="3"></circle>
          <circle cx="18" cy="19" r="3"></circle>
          <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
          <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
        </svg>
        Share Receipt
      </button>
    </div>

    <button class="btn-action" onclick="location.href='/'">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
      Pay Another Plate
    </button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script>
    const sessionId = new URLSearchParams(location.search).get("session") || "";
    let billData = null;

    try { localStorage.removeItem("afrc_active_session"); } catch (e) {}
    document.cookie = "afrc_active_session=; path=/; max-age=0; SameSite=Lax";

    async function load() {
      if (!sessionId) return;
      try {
        const res = await fetch("/api/sessions/" + encodeURIComponent(sessionId));
        if (!res.ok) return;
        const data = await res.json();
        billData = data;
        if (data.bill_number) {
          document.getElementById("billNo").textContent = "Bill #" + data.bill_number;
        }
        if (data.total !== undefined) {
          document.getElementById("total").textContent = "RM " + Number(data.total).toFixed(2);
        }
      } catch (e) {}
    }

    function buildOfficialReceiptPdf() {
      const { jsPDF } = window.jspdf;
      const items = (billData && billData.items) || [];
      const billNo = (billData && billData.bill_number) || "AAA-0001";
      const restName = (billData && billData.restaurant_name) || "AFRC";
      const compName = (billData && billData.company_name) || "";
      const compPhone = (billData && billData.company_phone) || "";
      const compEmail = (billData && billData.company_email) || "";
      const total = Number((billData && billData.total) || 0).toFixed(2);
      const dt = (billData && (billData.paid_at || billData.created_at))
        ? new Date(billData.paid_at || billData.created_at)
        : new Date();
      const dateStr = dt.toLocaleDateString("en-MY", { year: "numeric", month: "short", day: "2-digit" });
      const timeStr = dt.toLocaleTimeString("en-MY", { hour: "2-digit", minute: "2-digit", second: "2-digit" });

      const custPhone = (billData && billData.receipt_phone) || "";
      const custEmail = (billData && billData.receipt_email) || "";
      const hasCustomer = Boolean(custPhone || custEmail);
      const customerLines = (hasCustomer ? 1 : 0) + (custPhone ? 1 : 0) + (custEmail ? 1 : 0);

      const topInfoLines = (compName ? 1 : 0) + (compPhone ? 1 : 0) + (compEmail ? 1 : 0);
      const itemsHeight = items.length * 8.8;
      const pageHeight = Math.max(120, 98 + topInfoLines * 3.4 + customerLines * 3.6 + itemsHeight);
      const doc = new jsPDF({ unit: "mm", format: [80, pageHeight] });

      // Restaurant Header
      let curY = 10;
      doc.setFont("helvetica", "bold");
      doc.setFontSize(11);
      doc.setTextColor(15, 23, 42);
      doc.text(restName, 40, curY, { align: "center" });

      // Company Info & Support
      if (compName) {
        curY += 3.6;
        doc.setFont("helvetica", "normal");
        doc.setFontSize(7.0);
        doc.setTextColor(71, 85, 105);
        doc.text(compName, 40, curY, { align: "center" });
      }
      if (compPhone) {
        curY += 3.0;
        doc.setFont("helvetica", "normal");
        doc.setFontSize(6.2);
        doc.setTextColor(100, 116, 139);
        doc.text("Tel: " + compPhone, 40, curY, { align: "center" });
      }
      if (compEmail) {
        curY += 3.0;
        doc.setFont("helvetica", "normal");
        doc.setFontSize(6.2);
        doc.setTextColor(100, 116, 139);
        doc.text(compEmail, 40, curY, { align: "center" });
      }

      curY += 3.8;
      doc.setFont("helvetica", "normal");
      doc.setFontSize(7.2);
      doc.setTextColor(100, 116, 139);
      doc.text("OFFICIAL PAYMENT RECEIPT", 40, curY, { align: "center" });

      // Dashed divider
      curY += 3.5;
      doc.setDrawColor(203, 213, 225);
      doc.setLineDashPattern([1, 1], 0);
      doc.line(6, curY, 74, curY);

      // Bill metadata
      doc.setFontSize(8);
      doc.setTextColor(71, 85, 105);
      doc.text("BILL NO:", 6, curY + 5);
      doc.setFont("helvetica", "bold");
      doc.setTextColor(15, 23, 42);
      doc.text("#" + billNo, 74, curY + 5, { align: "right" });

      doc.setFont("helvetica", "normal");
      doc.setTextColor(71, 85, 105);
      doc.text("DATE:", 6, curY + 9.5);
      doc.setTextColor(15, 23, 42);
      doc.text(dateStr + " " + timeStr, 74, curY + 9.5, { align: "right" });

      doc.setTextColor(71, 85, 105);
      doc.text("STATUS:", 6, curY + 14);
      doc.setFont("helvetica", "bold");
      doc.setTextColor(16, 185, 129);
      doc.text("PAID", 74, curY + 14, { align: "right" });

      curY += 14;
      if (hasCustomer) {
        curY += 4.5;
        doc.setFont("helvetica", "bold");
        doc.setFontSize(7.0);
        doc.setTextColor(71, 85, 105);
        doc.text("Customer's Details:", 6, curY);

        doc.setFont("helvetica", "normal");
        doc.setFontSize(6.5);
        doc.setTextColor(51, 65, 85);
        if (custPhone) {
          curY += 3.4;
          doc.text(custPhone, 6, curY);
        }
        if (custEmail) {
          curY += 3.4;
          doc.text(custEmail, 6, curY);
        }
      }

      curY += 4.5;
      doc.line(6, curY, 74, curY);

      // Table column headers
      doc.setFont("helvetica", "bold");
      doc.setFontSize(7.5);
      doc.setTextColor(100, 116, 139);
      doc.text("ITEM / QTY", 6, curY + 4.5);
      doc.text("AMOUNT (RM)", 74, curY + 4.5, { align: "right" });
      doc.line(6, curY + 6.5, 74, curY + 6.5);

      // Items
      let y = curY + 11.5;
      doc.setFontSize(8);
      items.forEach((item) => {
        const pcs = item.piece_count ? ` (${item.piece_count} pcs)` : "";
        const label = `${item.name} x${item.quantity}${pcs}`;
        const sub = Number(item.subtotal || 0).toFixed(2);
        doc.setFont("helvetica", "bold");
        doc.setTextColor(15, 23, 42);
        doc.text(label.slice(0, 32), 6, y);
        doc.text(sub, 74, y, { align: "right" });

        if (item.unit_price !== undefined) {
          y += 3.5;
          doc.setFont("helvetica", "normal");
          doc.setFontSize(6.8);
          doc.setTextColor(100, 116, 139);
          doc.text(`@ RM ${Number(item.unit_price).toFixed(2)} / unit`, 6, y);
          doc.setFontSize(8);
        }
        y += 5.2;
      });

      doc.line(6, y - 1.5, 74, y - 1.5);

      // Total Box
      y += 4;
      doc.setFillColor(248, 250, 252);
      doc.setLineDashPattern([], 0);
      doc.roundedRect(6, y - 4, 68, 10, 2, 2, "F");
      doc.setFont("helvetica", "bold");
      doc.setFontSize(9.5);
      doc.setTextColor(15, 23, 42);
      doc.text("TOTAL PAID", 9, y + 2.2);
      doc.setTextColor(255, 94, 54);
      doc.text("RM " + total, 71, y + 2.2, { align: "right" });

      y += 10;
      if (billData && billData.curlec_payment_id) {
        doc.setFont("helvetica", "normal");
        doc.setFontSize(6.5);
        doc.setTextColor(100, 116, 139);
        doc.text("Payment Ref: " + billData.curlec_payment_id, 40, y, { align: "center" });
        y += 3.5;
      }

      if (sessionId) {
        doc.setFont("helvetica", "normal");
        doc.setFontSize(6.2);
        doc.setTextColor(148, 163, 184);
        doc.text("Session ID: " + sessionId.slice(0, 18), 40, y, { align: "center" });
        y += 4.5;
      } else {
        y += 1.5;
      }

      doc.setFont("helvetica", "bold");
      doc.setFontSize(7.5);
      doc.setTextColor(71, 85, 105);
      doc.text("Thank you for dining with us!", 40, y, { align: "center" });

      y += 3.8;
      doc.setFont("helvetica", "normal");
      doc.setFontSize(6.0);
      doc.setTextColor(100, 116, 139);
      doc.text("If you have any issue regarding this payment, please head to cashier for support", 40, y, { align: "center", maxWidth: 66 });

      return { doc, filename: `AFRC-Receipt-${billNo}.pdf`, billNo };
    }

    function saveReceiptPdf() {
      const { doc, filename } = buildOfficialReceiptPdf();
      doc.save(filename);
    }

    async function shareReceiptPdf() {
      const { doc, filename, billNo } = buildOfficialReceiptPdf();
      const blob = doc.output("blob");
      const file = new File([blob], filename, { type: "application/pdf" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({
            title: `AFRC Receipt #${billNo}`,
            text: `Official AFRC payment receipt for Bill #${billNo}`,
            files: [file],
          });
          return;
        } catch (err) {
          if (err && err.name === "AbortError") return;
        }
      }
      doc.save(filename);
    }

    load();
  </script>
</body></html>
