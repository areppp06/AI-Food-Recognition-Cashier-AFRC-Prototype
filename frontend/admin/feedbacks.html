<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>Customer Feedbacks — AFRC Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
<link rel="stylesheet" href="/static/admin/shared/admin.css">
</head>
<body>

<aside class="sidebar" id="sidebar"></aside>
<div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeSidebar()"></div>

<div class="main-wrapper">
  <header class="topbar" id="topbar"></header>
  <main class="content">
    <section class="section-pane active" id="tab-feedbacks">
      <div class="panel-card" style="margin-bottom:1.5rem;">
        <div class="panel-header" style="border-bottom:1px solid #f1f5f9; padding-bottom:1rem;">
          <div>
            <div class="panel-title" style="display:flex; align-items:center; gap:0.5rem;">
              <svg style="width:20px;height:20px;color:#f59e0b;" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"></path>
              </svg>
              <span>Customer Feedbacks &amp; Ratings</span>
            </div>
            <p style="font-size:0.82rem; color:#64748b; margin-top:0.25rem;">
              Reviews submitted after bill payment.
            </p>
          </div>
          <button type="button" class="btn btn-outline btn-sm" onclick="loadFeedbacks()">
            <svg class="btn-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" stroke-linecap="round" stroke-linejoin="round"></path></svg>
            <span>Refresh</span>
          </button>
        </div>

        <div class="panel-body" style="padding:1.25rem 1rem;">
          <div class="stats-grid" style="margin-bottom:1.25rem;">
            <div class="stat-card">
              <div class="stat-label">Average Rating</div>
              <div class="stat-value" id="fbAvgRating">0.0 <span style="font-size:1.1rem;">★</span></div>
              <div class="stat-sub" id="fbTotalCount">0 total reviews</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Positive Reviews (4★ - 5★)</div>
              <div class="stat-value green" id="fbPositiveCount">0</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Improvement Needed (1★ - 3★)</div>
              <div class="stat-value orange" id="fbImproveCount">0</div>
              <div class="stat-sub">Constructive feedback</div>
            </div>
          </div>

          <div class="table-wrap">
            <table id="feedbacksTable">
              <thead>
                <tr>
                  <th style="min-width:130px;">Date &amp; Time</th>
                  <th style="min-width:110px;">Paid Bill #</th>
                  <th style="min-width:120px;">Customer Phone</th>
                  <th style="width:90px; text-align:center;">Plate Photo</th>
                  <th style="min-width:125px;">Rating</th>
                  <th style="min-width:160px;">Quick Tags</th>
                  <th>Customer Comment</th>
                </tr>
              </thead>
              <tbody id="feedbacksBody">
                <tr>
                  <td colspan="7" style="text-align:center; color:#94a3b8; padding:2rem;">Loading feedbacks...</td>
                </tr>
              </tbody>
            </table>
          </div>
          <div class="feedbacks-mobile-list" id="feedbacksMobileList"></div>
        </div>
      </div>
    </section>
  </main>
</div>


<script src="/static/admin/shared/admin-shell.js"></script>
<script src="/static/admin/js/feedbacks.js"></script>
<script>
  initAdminShell({
    activeTab: "feedbacks",
    title: "Customer Feedbacks",
    onRefresh: loadFeedbacks
  });
</script>
</body>
</html>
