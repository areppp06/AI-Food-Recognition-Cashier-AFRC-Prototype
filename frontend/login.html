<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin - AFRC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --card-bg: #ffffff;
      --input-bg: #f8fafc;
      --input-border: #e2e8f0;
      --orange: #ff5e36;
      --orange-focus: rgba(255, 94, 54, 0.2);
      --text: #0f172a;
      --text-muted: #64748b;
      --text-label: #334155;
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
    }

    .auth-wrapper {
      width: 100%;
      max-width: 440px;
    }

    .auth-header {
      margin-bottom: 2.25rem;
    }

    .auth-title {
      font-size: 2.75rem;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -0.035em;
      line-height: 1.1;
      margin-bottom: 0.65rem;
    }

    .auth-sub {
      color: var(--text-muted);
      font-size: 0.98rem;
      line-height: 1.45;
      font-weight: 400;
    }

    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .form-label {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text-label);
    }

    .input-box {
      position: relative;
      display: flex;
      align-items: center;
      background-color: var(--input-bg);
      border: 1.5px solid var(--input-border);
      border-radius: 14px;
      transition: all 0.2s ease;
    }

    .input-box:focus-within {
      border-color: var(--orange);
      box-shadow: 0 0 0 3px var(--orange-focus);
      background-color: #ffffff;
    }

    .input-box input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      padding: 1rem 1.15rem;
      color: #0f172a;
      font-size: 0.98rem;
      font-family: inherit;
    }

    .input-box input::placeholder {
      color: #94a3b8;
    }

    .input-box input:-webkit-autofill,
    .input-box input:-webkit-autofill:hover, 
    .input-box input:-webkit-autofill:focus {
      -webkit-text-fill-color: #0f172a;
      -webkit-box-shadow: 0 0 0px 1000px #ffffff inset;
      transition: background-color 5000s ease-in-out 0s;
    }

    .toggle-pwd-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: 0 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s ease;
      height: 100%;
    }

    .toggle-pwd-btn:hover {
      color: #475569;
    }

    .toggle-pwd-btn svg {
      width: 20px;
      height: 20px;
    }

    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: -0.25rem;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
    }

    .remember-label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: #64748b;
      cursor: pointer;
      user-select: none;
    }

    .remember-checkbox {
      appearance: none;
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border: 1.5px solid #cbd5e1;
      border-radius: 50%;
      background: #ffffff;
      cursor: pointer;
      display: inline-grid;
      place-content: center;
      transition: all 0.15s ease;
    }

    .remember-checkbox:checked {
      border-color: var(--orange);
      background: var(--orange);
    }

    .remember-checkbox:checked::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ffffff;
    }

    .btn-action {
      width: 100%;
      background: var(--orange);
      color: #ffffff;
      border: none;
      border-radius: 9999px;
      padding: 1rem 1.25rem;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 0.75rem;
    }

    .btn-action:hover:not(:disabled) {
      background: #ff4a1d;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px -3px rgba(255, 94, 54, 0.35);
    }

    .btn-action:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .msg-banner {
      display: none;
      padding: 0.85rem 1rem;
      border-radius: 12px;
      font-size: 0.88rem;
      line-height: 1.4;
      margin-bottom: 1.25rem;
    }

    .msg-error {
      background: var(--danger-bg);
      border: 1px solid rgba(239, 68, 68, 0.25);
      color: #dc2626;
    }

    .msg-success {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.25);
      color: #059669;
    }

    .bottom-return {
      margin-top: 2.5rem;
      text-align: center;
      font-size: 0.85rem;
      color: #94a3b8;
    }

    .bottom-return a {
      color: #64748b;
      text-decoration: none;
      transition: color 0.15s ease;
    }

    .bottom-return a:hover {
      color: var(--orange);
    }
  </style>
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-header">
      <h1 class="auth-title" id="authTitle">Welcome Back</h1>
      <p class="auth-sub" id="authSub">to E-Cashier Dashboard</p>
    </div>

    <div class="msg-banner msg-error" id="errorMsg"></div>
    <div class="msg-banner msg-success" id="successMsg"></div>

    <form class="auth-form" id="authForm" onsubmit="handleAuthSubmit(event)">
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <div class="input-box">
          <input type="text" id="username" name="username" placeholder="Enter your username" required autocomplete="username" autofocus>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="input-box">
          <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
          <button type="button" class="toggle-pwd-btn" onclick="togglePasswordVisibility('password', this)" aria-label="Toggle password visibility">
            <svg class="eye-show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <div class="form-group" id="confirmGroup" style="display: none;">
        <label class="form-label" for="confirmPassword">Confirm Password</label>
        <div class="input-box">
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password" autocomplete="new-password">
          <button type="button" class="toggle-pwd-btn" onclick="togglePasswordVisibility('confirmPassword', this)" aria-label="Toggle password visibility">
            <svg class="eye-show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <div class="form-options" id="optionsRow" style="display: none;">
        <label class="remember-label">
          <input type="checkbox" class="remember-checkbox" checked>
          <span>Keep me signed in</span>
        </label>
      </div>

      <button type="submit" class="btn-action" id="actionBtn">Sign In</button>
    </form>

    <div class="bottom-return">
      <a href="/">&larr; Return to Camera Kiosk</a>
    </div>
  </div>

  <script>
    const EYE_SHOW_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
    const EYE_HIDE_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`;

    let isSetupMode = false;

    function togglePasswordVisibility(fieldId, btn) {
      const field = document.getElementById(fieldId);
      if (!field) return;
      if (field.type === "password") {
        field.type = "text";
        btn.innerHTML = EYE_HIDE_SVG;
      } else {
        field.type = "password";
        btn.innerHTML = EYE_SHOW_SVG;
      }
    }

    function showError(msg) {
      const el = document.getElementById("errorMsg");
      el.textContent = msg;
      el.style.display = "block";
      document.getElementById("successMsg").style.display = "none";
    }

    function showSuccess(msg) {
      const el = document.getElementById("successMsg");
      el.textContent = msg;
      el.style.display = "block";
      document.getElementById("errorMsg").style.display = "none";
    }

    function clearMessages() {
      document.getElementById("errorMsg").style.display = "none";
      document.getElementById("successMsg").style.display = "none";
    }

    async function initAuthView() {
      try {
        const res = await fetch("/api/auth/status", { cache: "no-store" });
        if (!res.ok) return;
        const data = await res.json();

        // If already logged in, redirect straight to admin or next param
        if (data.is_authenticated) {
          const urlParams = new URLSearchParams(window.location.search);
          const next = urlParams.get("next") || "/admin";
          window.location.href = next;
          return;
        }

        const restaurantName = data.restaurant_name || "AFRC";

        if (data.needs_setup) {
          setSetupMode();
        } else {
          setSignInMode(restaurantName);
        }
      } catch (e) {
        console.error("Auth init error:", e);
      }
    }

    function setSetupMode() {
      isSetupMode = true;
      document.getElementById("authTitle").textContent = "Welcome";
      document.getElementById("authSub").textContent = "Setup your admin account here";
      document.getElementById("confirmGroup").style.display = "flex";
      document.getElementById("confirmPassword").setAttribute("required", "required");
      document.getElementById("optionsRow").style.display = "none";
      document.getElementById("actionBtn").textContent = "Setup";
      document.getElementById("username").value = "admin";
      document.getElementById("password").setAttribute("autocomplete", "new-password");
    }

    function setSignInMode(restaurantName) {
      isSetupMode = false;
      const name = restaurantName || "AFRC";
      document.getElementById("authTitle").textContent = "Welcome Back";
      document.getElementById("authSub").textContent = `to ${name} E-Cashier Dashboard`;
      document.getElementById("confirmGroup").style.display = "none";
      document.getElementById("confirmPassword").removeAttribute("required");
      document.getElementById("optionsRow").style.display = "flex";
      document.getElementById("actionBtn").textContent = "Sign In";
      document.getElementById("password").setAttribute("autocomplete", "current-password");
    }

    async function handleAuthSubmit(e) {
      e.preventDefault();
      clearMessages();

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      const btn = document.getElementById("actionBtn");

      if (!username) {
        showError("Please enter your username.");
        return;
      }
      if (password.length < 6) {
        showError("Password must be at least 6 characters.");
        return;
      }

      if (isSetupMode) {
        const confirm = document.getElementById("confirmPassword").value;
        if (password !== confirm) {
          showError("Passwords do not match.");
          return;
        }
      }

      btn.disabled = true;
      btn.textContent = isSetupMode ? "Setting up..." : "Signing in...";

      try {
        const endpoint = isSetupMode ? "/api/auth/setup" : "/api/auth/login";
        const res = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.detail || "Authentication failed.");
        }

        showSuccess(isSetupMode ? "Admin setup complete! Opening dashboard..." : "Success! Redirecting...");
        const urlParams = new URLSearchParams(window.location.search);
        const nextUrl = urlParams.get("next") || "/admin";

        setTimeout(() => {
          window.location.href = nextUrl;
        }, 400);

      } catch (err) {
        showError(err.message || "An error occurred.");
        btn.disabled = false;
        btn.textContent = isSetupMode ? "Setup" : "Sign In";
      }
    }

    initAuthView();
  </script>
</body>
</html>
